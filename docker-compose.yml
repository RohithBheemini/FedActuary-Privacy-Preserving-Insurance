version: '3.8'

services:
  fedsure-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fedsure_mutual_enterprise
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
